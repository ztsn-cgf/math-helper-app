name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-35 build-tools;35.0.0

      - name: Grant gradlew executable
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: math-helper-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Publish Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create v0.5.1 app/build/outputs/apk/debug/*.apk --repo "${{ github.repository }}" --title "数学助手 v0.5.1 测试版" --notes "修复：答题空输入/乱输入误判为对；首页新增「检查更新」按钮" || echo "tag 已存在，跳过发布"
